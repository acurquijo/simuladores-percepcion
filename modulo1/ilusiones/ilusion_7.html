<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ilusión 7</title>

<style>
  :root {
    --primary: #162593;
    --accent: #00e2e0;
    --track-bg: #e0e0e0;
    --dark: #333;
  }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }

  .container {
    background: #ececec;
    padding: 30px 40px;
    border-radius: 20px;
    width: 550px;
    height: 340px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 30px;
  }

  /* Contenedor de botones */
  .button-stack {
    display: flex;
    flex-direction: column;
    gap: 30px;
    width: 100%;
  }

  button {
    padding: 12px;
    border-radius: 12px;
    border: none;
    background: var(--primary);
    color: white;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    width: 100%;
  }

  button:hover {
    filter: brightness(1.2);
  }

  button.active {
    background: var(--dark);
  }
</style>
</head>

<body>

<div class="container">

  <div class="button-stack">

    <button id="metroBtn">
      Iniciar Metrónomo
    </button>

    <button id="bellBtn">
      Iniciar Campana
    </button>

  </div>

</div>

<audio id="metronome" src="sound/metronome.mp3"></audio>
<audio id="bell" src="sound/bell.mp3"></audio>

<script>

  const metronomeAudio =
    document.getElementById("metronome");

  const bellAudio =
    document.getElementById("bell");

  const metroBtn =
    document.getElementById("metroBtn");

  const bellBtn =
    document.getElementById("bellBtn");


  let metroPlaying = false;


  /* =========================
     METRÓNOMO
     ========================= */

  metroBtn.addEventListener("click", () => {

    metroPlaying = !metroPlaying;

    if (metroPlaying) {

      metronomeAudio.currentTime = 0;
      metronomeAudio.loop = true;
      metronomeAudio.play();

      metroBtn.textContent =
        "Pausar Metrónomo";

      metroBtn.classList.add("active");

    } else {

      metronomeAudio.pause();

      metroBtn.textContent =
        "Iniciar Metrónomo";

      metroBtn.classList.remove("active");
    }

  });


  /* =========================
     CAMPANA
     ========================= */

  bellBtn.addEventListener("click", () => {

    bellAudio.currentTime = 0;
    bellAudio.play();

  });


  /* =========================
     FINALIZACIÓN DEL AUDIO
     ========================= */

  metronomeAudio.onended = () => {

    metroPlaying = false;

    metroBtn.textContent =
      "Iniciar Metrónomo";

    metroBtn.classList.remove("active");

  };

</script>

</body>
</html>
