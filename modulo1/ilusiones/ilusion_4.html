<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ilusión 4</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
  :root {
    --primary: #162593;
    --accent: #00e2e0;
    --track-bg: #ddd;
    --bg-panel: #ececec;
  }

  body {
    margin: 0;
    background: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Poppins', sans-serif;
  }

  /* PANEL DE VISUALIZACIÓN: 550 x 340 px */
  .wrapper {
    width: 550px;
    height: 340px;
    background: var(--bg-panel);
    border-radius: 20px;
    padding: 25px 35px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    box-shadow: 0 10px 25px rgba(0,0,0,0.05);
  }

  .scene {
    position: relative;
    height: 200px;
    border-radius: 12px;
    background: #f8f9fa;
    border: 1px solid #eee;
    overflow: hidden;
  }

  .dot {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--primary);
    display: none;
    box-shadow: 0 0 15px rgba(22, 37, 147, 0.2);
  }

  /* Diferenciamos los dos círculos */
  #dotB {
    background: var(--accent);
    box-shadow: 0 0 15px rgba(0, 226, 224, 0.2);
  }

  .controls {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .control-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  label {
    font-size: 15px;
    font-weight: 600;
    color: #333;
    display: flex;
    justify-content: space-between;
  }

  .value-display {
    color: var(--primary);
  }

  input[type="range"] {
    appearance: none;
    -webkit-appearance: none;
    width: 100%;
    height: 12px;
    background: var(--track-bg);
    border-radius: 50px;
    outline: none;
    background-image: linear-gradient(to right, var(--accent), var(--primary));
    background-repeat: no-repeat;
    background-size: 0% 100%;
  }

  input[type="range"]::-webkit-slider-thumb {
    appearance: none;
    -webkit-appearance: none;
    height: 20px;
    width: 20px;
    border-radius: 50%;
    background: var(--primary);
    cursor: pointer;
    border: 2px solid #fff;
  }

</style>
</head>

<body>

<div class="wrapper">

  <div class="scene" id="sceneContainer">
    <div class="dot" id="dotA"></div>
    <div class="dot" id="dotB"></div>
  </div>

  <div class="controls">

    <div class="control-group">

      <label>
        Intervalo Δt
        <span class="value-display" id="dtVal">150 ms</span>
      </label>

      <input
        type="range"
        min="30"
        max="500"
        value="150"
        id="dtSlider"
      >

    </div>

  </div>

</div>

<script>

const dotA = document.getElementById("dotA");
const dotB = document.getElementById("dotB");

const dtSlider = document.getElementById("dtSlider");
const dtVal = document.getElementById("dtVal");

const container = document.getElementById("sceneContainer");

let loopTimeout;


/* ---------------------------------
   ESTILO DEL SLIDER
---------------------------------- */

function updateSliderStyle(slider) {

  const percentage =
    ((slider.value - slider.min) /
    (slider.max - slider.min)) * 100;

  slider.style.backgroundSize =
    percentage + '% 100%';
}


/* ---------------------------------
   POSICIÓN FIJA DE LOS CÍRCULOS
---------------------------------- */

function positionDots() {

  const center = container.offsetWidth / 2;

  /*
    Distancia fija entre los círculos.
    Ya no depende de un slider.
  */

  const fixedDistance = 120;

  dotA.style.left =
    (center - fixedDistance / 2 - 12) + "px";

  dotB.style.left =
    (center + fixedDistance / 2 - 12) + "px";
}


/* ---------------------------------
   ANIMACIÓN ALTERNADA
---------------------------------- */

function runLoop() {

  clearTimeout(loopTimeout);

  const dt = parseInt(dtSlider.value);

  /*
    Círculo A aparece primero.
  */

  dotA.style.display = "block";
  dotB.style.display = "none";


  /*
    Después del intervalo aparece B,
    mientras A todavía permanece visible.
    
    Esto genera un pequeño momento
    de simultaneidad perceptual.
  */

  loopTimeout = setTimeout(() => {

    dotB.style.display = "block";

    /*
      A permanece visible durante
      un intervalo adicional.
    */

    loopTimeout = setTimeout(() => {

      dotA.style.display = "none";

      /*
        B continúa visible durante
        el siguiente intervalo.
      */

      loopTimeout = setTimeout(() => {

        dotB.style.display = "none";

        /*
          Reinicia el ciclo.
        */

        loopTimeout = setTimeout(runLoop, dt);

      }, dt);

    }, dt);

  }, dt);
}


/* ---------------------------------
   EVENTO DEL SLIDER
---------------------------------- */

updateSliderStyle(dtSlider);

dtSlider.addEventListener("input", () => {

  updateSliderStyle(dtSlider);

  dtVal.textContent =
    dtSlider.value + " ms";

  /*
    Reiniciar la animación con
    el nuevo intervalo.
  */

  runLoop();

});


/* ---------------------------------
   INICIALIZACIÓN
---------------------------------- */

positionDots();
runLoop();

</script>

</body>
</html>
